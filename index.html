<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Perp Dashboard · Bybit + Binance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg:      #07090d;
    --surface: #0e1117;
    --card:    #121620;
    --border:  #1c2030;
    --muted:   #3a4055;
    --text:    #b8c0d8;
    --bright:  #eef1fa;
    --green:   #00e5a0;
    --red:     #ff3d5e;
    --yellow:  #f0c040;
    --accent:  #4d7cfe;
    --accent2: #9d6fff;
    --mono:    'JetBrains Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    height: 100%;
    overflow-x: hidden;
  }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── Topbar ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    position: relative;
    z-index: 20;
  }

  #topbar h1 {
    font-family: var(--display);
    font-size: 17px;
    font-weight: 800;
    color: var(--bright);
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  #topbar h1 .a { color: var(--accent); }
  #topbar h1 .b { color: var(--accent2); }

  .exchange-badges {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: .8px;
    text-transform: uppercase;
    border: 1px solid;
  }
  .badge.bybit   { border-color: #f7a600; color: #f7a600; background: rgba(247,166,0,.08); }
  .badge.binance { border-color: #f0b90b; color: #f0b90b; background: rgba(240,185,11,.08); }

  .divider { width: 1px; height: 20px; background: var(--border); }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
  }
  .ctrl-group label { white-space: nowrap; }

  select, input[type=text], input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 4px;
    outline: none;
    transition: border-color .15s;
  }
  select:hover, input:hover,
  select:focus, input:focus { border-color: var(--accent); }

  #search { width: 110px; }
  #topN   { width: 58px; }

  #status-pill {
    margin-left: auto;
    font-size: 9px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
  }
  #status-pill.ok      { border-color: var(--green); color: var(--green); }
  #status-pill.err     { border-color: var(--red);   color: var(--red); }
  #status-pill.loading { border-color: var(--yellow); color: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ── Progress ── */
  #progress-wrap { height: 2px; background: var(--border); overflow: hidden; }
  #progress-bar  {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    transition: width .25s ease;
  }

  /* ── Error banner ── */
  #error-banner {
    display: none;
    background: rgba(255,61,94,.08);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 8px 18px;
    font-size: 11px;
    margin: 6px 8px;
    border-radius: 5px;
  }

  /* ── Table container ── */
  #table-wrap {
    flex: 1;
    overflow: auto;
    padding: 0 6px 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
  }

  th {
    padding: 7px 5px;
    text-align: right;
    font-size: 9px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .6px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color .15s;
  }
  th:hover { color: var(--bright); }
  th.sort-asc::after  { content: ' ▲'; color: var(--accent); }
  th.sort-desc::after { content: ' ▼'; color: var(--accent); }
  th:first-child { text-align: left; }

  .group-th {
    text-align: center !important;
    border-left: 1px solid var(--border);
    color: var(--accent) !important;
    font-size: 8px !important;
    letter-spacing: 1.2px;
    cursor: default !important;
    padding: 4px 0 !important;
    background: rgba(77,124,254,.04);
  }

  td {
    padding: 4px 5px;
    text-align: right;
    border-bottom: 1px solid #0f1218;
    font-size: 11px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: background .08s;
  }
  td:first-child { text-align: left; }

  tr:hover td { background: #0d1019; }

  .pos  { color: var(--green); }
  .neg  { color: var(--red); }
  .zero { color: var(--muted); }
  .na   { color: #222530; }

  .hi3 { background: rgba(0,229,160,.10) !important; }
  .hi2 { background: rgba(0,229,160,.05) !important; }
  .lo3 { background: rgba(255,61,94,.10) !important; }
  .lo2 { background: rgba(255,61,94,.05) !important; }

  /* Symbol */
  .sym-wrap { display: flex; flex-direction: column; line-height: 1.2; }
  .sym-base  { font-size: 12px; font-weight: 700; color: var(--bright); }
  .sym-quote { font-size: 9px; color: var(--muted); }
  .sym-src   { display: flex; gap: 3px; margin-top: 2px; }
  .src-dot {
    width: 5px; height: 5px; border-radius: 50%;
    display: inline-block;
  }
  .src-dot.bybit   { background: #f7a600; }
  .src-dot.binance { background: #f0b90b; }

  /* Sparkline cell */
  .spark-cell {
    padding: 3px 5px !important;
    vertical-align: middle;
  }
  .spark-cell canvas {
    display: block;
    margin: 0 auto;
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text);
    z-index: 1000;
    pointer-events: none;
    min-width: 200px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  #tooltip .tt-sym   { font-family: var(--display); font-size: 14px; font-weight: 800; color: var(--bright); margin-bottom: 8px; }
  #tooltip .tt-row   { display: flex; justify-content: space-between; gap: 12px; margin: 3px 0; }
  #tooltip .tt-label { color: var(--muted); font-size: 10px; }
  #tooltip .tt-val   { font-weight: 600; }
  #tooltip .tt-chart-label { font-size: 9px; color: var(--muted); margin-top: 8px; margin-bottom: 4px; letter-spacing: .5px; text-transform: uppercase; }

  /* ── Footer ── */
  #footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 18px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 9px;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 6px;
  }
  #next-refresh { color: var(--text); font-weight: 700; }

  /* Skeleton */
  .skel td { background: var(--surface) !important; }
  .skel td span {
    display: inline-block;
    width: 44px; height: 9px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--border) 25%, #1a1f2e 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  .skel td:first-child span { width: 80px; }
  @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <h1>📊 <span class="a">Perp</span><span class="b">Dash</span></h1>

    <div class="exchange-badges">
      <span class="badge bybit">Bybit</span>
      <span class="badge binance">Binance</span>
    </div>

    <div class="divider"></div>

    <div class="ctrl-group">
      <label>Top</label>
      <input type="number" id="topN" value="50" min="5" max="200" step="5"/>
    </div>

    <div class="ctrl-group">
      <label>Refresh</label>
      <select id="refreshSel">
        <option value="10">10s</option>
        <option value="20" selected>20s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
        <option value="120">120s</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Sort</label>
      <select id="sortSel">
        <option value="vol">Volume</option>
        <option value="price_5m">P% 5m</option>
        <option value="price_15m">P% 15m</option>
        <option value="price_1h">P% 1h</option>
        <option value="price_4h">P% 4h</option>
        <option value="price_1d">P% 1d</option>
        <option value="oi_5m">OI% 5m</option>
        <option value="oi_15m">OI% 15m</option>
        <option value="oi_1h">OI% 1h</option>
        <option value="oi_4h">OI% 4h</option>
        <option value="oi_1d">OI% 1d</option>
        <option value="fr_last">FR Last</option>
      </select>
      <select id="sortDir">
        <option value="desc">▼ Desc</option>
        <option value="asc">▲ Asc</option>
      </select>
    </div>

    <div class="ctrl-group">
      <input type="text" id="search" placeholder="🔍 Search…"/>
    </div>

    <div id="status-pill" class="loading">Connecting…</div>
  </div>

  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="error-banner"></div>

  <div id="table-wrap">
    <table id="main-table">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="footer">
    <span>Bybit V5 + Binance Futures API · USDT Perpetuals · Browser-side fetching</span>
    <span>Next refresh: <span id="next-refresh">—</span></span>
    <span id="last-updated">—</span>
  </div>
</div>

<div id="tooltip"></div>

<script>
// ═══════════════════════════════════════════════
// ENDPOINTS
// ═══════════════════════════════════════════════
const BYBIT   = 'https://api.bybit.com';
const BINANCE = 'https://fapi.binance.com';

const TIMEFRAMES = ['5m','15m','1h','4h','1d'];
const TF_BYBIT_KLINE = { '5m':'5','15m':'15','1h':'60','4h':'240','1d':'D' };
const TF_BYBIT_OI    = { '5m':'5min','15m':'15min','1h':'1h','4h':'4h','1d':'1d' };
const TF_BN_KLINE    = { '5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };
const TF_BN_OI       = { '5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };

const CONCURRENCY = 6;
const OI_HISTORY_LIMIT = 25; // for sparkline

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let rows       = [];
let sortCol    = 'vol';
let sortDir    = 'desc';
let searchQ    = '';
let refreshSec = 20;
let topN       = 50;
let countdownTimer, countdownVal;

// ═══════════════════════════════════════════════
// FETCH HELPERS
// ═══════════════════════════════════════════════
async function bybitFetch(path, params={}) {
  const url = new URL(BYBIT + path);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const r = await fetch(url.toString(), { signal: AbortSignal.timeout(10000) });
  if (!r.ok) throw new Error(`Bybit HTTP ${r.status}`);
  const j = await r.json();
  if (j.retCode !== 0) throw new Error(`Bybit ${j.retCode}: ${j.retMsg}`);
  return j.result;
}

async function bnFetch(path, params={}) {
  const url = new URL(BINANCE + path);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const r = await fetch(url.toString(), { signal: AbortSignal.timeout(10000) });
  if (!r.ok) throw new Error(`Binance HTTP ${r.status}`);
  return r.json();
}

function pct(newV, oldV) {
  const n = parseFloat(newV), o = parseFloat(oldV);
  if (!isFinite(n) || !isFinite(o) || o === 0) return null;
  return (n - o) / Math.abs(o) * 100;
}

// ═══════════════════════════════════════════════
// TOP SYMBOLS
// ═══════════════════════════════════════════════
async function fetchTopBybit(n) {
  const res = await bybitFetch('/v5/market/tickers', { category: 'linear' });
  return (res.list || [])
    .filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('-'))
    .sort((a,b) => parseFloat(b.turnover24h||0) - parseFloat(a.turnover24h||0))
    .slice(0, n)
    .map(t => ({ symbol: t.symbol, vol: parseFloat(t.turnover24h||0), exchange: 'bybit' }));
}

async function fetchTopBinance(n) {
  try {
    const data = await bnFetch('/fapi/v1/ticker/24hr');
    return data
      .filter(t => t.symbol.endsWith('USDT'))
      .sort((a,b) => parseFloat(b.quoteVolume||0) - parseFloat(a.quoteVolume||0))
      .slice(0, n)
      .map(t => ({ symbol: t.symbol, vol: parseFloat(t.quoteVolume||0), exchange: 'binance' }));
  } catch { return []; }
}

async function fetchTopSymbols(n) {
  const [bb, bn] = await Promise.all([fetchTopBybit(n), fetchTopBinance(n)]);

  // Merge: prefer Bybit, add Binance-only symbols
  const bybitSymbols = new Set(bb.map(x => x.symbol));
  const merged = [...bb];

  // Tag bybit symbols that also exist on binance
  const bnMap = Object.fromEntries(bn.map(x => [x.symbol, x]));
  for (const row of merged) {
    if (bnMap[row.symbol]) row.hasBinance = true;
  }
  // Add binance-only
  for (const b of bn) {
    if (!bybitSymbols.has(b.symbol)) merged.push(b);
  }

  // Re-sort by combined vol
  merged.sort((a,b) => b.vol - a.vol);
  return merged.slice(0, n);
}

// ═══════════════════════════════════════════════
// PER-SYMBOL: BYBIT
// ═══════════════════════════════════════════════
async function fetchBybitSymbol(symbol) {
  const klineP = TIMEFRAMES.map(tf =>
    bybitFetch('/v5/market/kline', { category:'linear', symbol, interval: TF_BYBIT_KLINE[tf], limit: 3 }).catch(()=>null)
  );
  const oiP = TIMEFRAMES.map(tf =>
    bybitFetch('/v5/market/open-interest', { category:'linear', symbol, intervalTime: TF_BYBIT_OI[tf], limit: 3 }).catch(()=>null)
  );
  const oiHistP = bybitFetch('/v5/market/open-interest', {
    category:'linear', symbol, intervalTime:'15min', limit: OI_HISTORY_LIMIT
  }).catch(()=>null);
  const frP = bybitFetch('/v5/market/funding/history', { category:'linear', symbol, limit: 2 }).catch(()=>null);

  const [klineRes, oiRes, oiHist, frRes] = await Promise.all([
    Promise.all(klineP), Promise.all(oiP), oiHistP, frP
  ]);

  const row = { symbol };

  TIMEFRAMES.forEach((tf,i) => {
    try {
      const list = klineRes[i]?.list;
      row[`price_${tf}`] = (list && list.length >= 2) ? pct(list[0][4], list[1][4]) : null;
    } catch { row[`price_${tf}`] = null; }
  });

  TIMEFRAMES.forEach((tf,i) => {
    try {
      const list = oiRes[i]?.list;
      row[`oi_${tf}`] = (list && list.length >= 2) ? pct(list[0].openInterest, list[1].openInterest) : null;
    } catch { row[`oi_${tf}`] = null; }
  });

  // OI sparkline history (newest first → reverse for chart)
  try {
    const list = oiHist?.list || [];
    row.oiHistory = list.map(x => parseFloat(x.openInterest)).reverse();
  } catch { row.oiHistory = []; }

  try {
    const list = frRes?.list;
    if (list && list.length >= 1) {
      row.fr_last  = parseFloat(list[0].fundingRate) * 100;
      row.fr_delta = list.length >= 2 ? row.fr_last - parseFloat(list[1].fundingRate)*100 : null;
    } else { row.fr_last = row.fr_delta = null; }
  } catch { row.fr_last = row.fr_delta = null; }

  return row;
}

// ═══════════════════════════════════════════════
// PER-SYMBOL: BINANCE
// ═══════════════════════════════════════════════
async function fetchBinanceSymbol(symbol) {
  const klineP = TIMEFRAMES.map(tf =>
    bnFetch('/fapi/v1/klines', { symbol, interval: TF_BN_KLINE[tf], limit: 3 }).catch(()=>null)
  );
  const oiP = TIMEFRAMES.filter(tf => TF_BN_OI[tf]).map(tf =>
    bnFetch('/futures/data/openInterestHist', { symbol, period: TF_BN_OI[tf], limit: 3 }).catch(()=>null)
  );
  const oiHistP = bnFetch('/futures/data/openInterestHist', {
    symbol, period: '15m', limit: OI_HISTORY_LIMIT
  }).catch(()=>null);
  const frP = bnFetch('/fapi/v1/fundingRate', { symbol, limit: 2 }).catch(()=>null);

  const [klineRes, oiRes, oiHist, frRes] = await Promise.all([
    Promise.all(klineP), Promise.all(oiP), oiHistP, frP
  ]);

  const row = { symbol };

  TIMEFRAMES.forEach((tf,i) => {
    try {
      const list = klineRes[i];
      // Binance: [openTime, open, high, low, close, ...]
      row[`price_${tf}`] = (list && list.length >= 2) ? pct(list[list.length-1][4], list[list.length-2][4]) : null;
    } catch { row[`price_${tf}`] = null; }
  });

  const validTFs = TIMEFRAMES.filter(tf => TF_BN_OI[tf]);
  validTFs.forEach((tf,i) => {
    try {
      const list = oiRes[i];
      row[`oi_${tf}`] = (list && list.length >= 2)
        ? pct(list[list.length-1].sumOpenInterest, list[list.length-2].sumOpenInterest)
        : null;
    } catch { row[`oi_${tf}`] = null; }
  });

  try {
    const list = oiHist || [];
    row.oiHistory = list.map(x => parseFloat(x.sumOpenInterest));
  } catch { row.oiHistory = []; }

  try {
    if (frRes && frRes.length >= 1) {
      row.fr_last  = parseFloat(frRes[frRes.length-1].fundingRate) * 100;
      row.fr_delta = frRes.length >= 2
        ? row.fr_last - parseFloat(frRes[frRes.length-2].fundingRate)*100
        : null;
    } else { row.fr_last = row.fr_delta = null; }
  } catch { row.fr_last = row.fr_delta = null; }

  return row;
}

// ═══════════════════════════════════════════════
// MERGE BYBIT + BINANCE OI (when both available)
// ═══════════════════════════════════════════════
function mergeRows(bybitRow, binanceRow) {
  if (!bybitRow && !binanceRow) return null;
  if (!bybitRow) return { ...binanceRow, exchanges: ['binance'] };
  if (!binanceRow) return { ...bybitRow, exchanges: ['bybit'] };

  const merged = { ...bybitRow, exchanges: ['bybit','binance'] };

  // Average OI % where both available
  TIMEFRAMES.forEach(tf => {
    const bb = bybitRow[`oi_${tf}`], bn = binanceRow[`oi_${tf}`];
    if (bb !== null && bn !== null && isFinite(bb) && isFinite(bn)) {
      merged[`oi_${tf}`] = (bb + bn) / 2;
    }
  });

  // Average price % where both available
  TIMEFRAMES.forEach(tf => {
    const bb = bybitRow[`price_${tf}`], bn = binanceRow[`price_${tf}`];
    if (bb !== null && bn !== null && isFinite(bb) && isFinite(bn)) {
      merged[`price_${tf}`] = (bb + bn) / 2;
    }
  });

  // Average FR
  if (bybitRow.fr_last !== null && binanceRow.fr_last !== null) {
    merged.fr_last = (bybitRow.fr_last + binanceRow.fr_last) / 2;
  }

  // Keep bybit OI history for sparkline
  return merged;
}

// ═══════════════════════════════════════════════
// BATCH FETCH
// ═══════════════════════════════════════════════
async function batchFetch(symbols) {
  const results = [];
  let idx = 0, done = 0;
  const total = symbols.length;
  setProgress(0);

  async function worker() {
    while (true) {
      const i = idx++;
      if (i >= total) break;
      const sym = symbols[i];
      try {
        let row;
        if (sym.exchange === 'bybit' && sym.hasBinance) {
          const [bb, bn] = await Promise.all([
            fetchBybitSymbol(sym.symbol).catch(()=>null),
            fetchBinanceSymbol(sym.symbol).catch(()=>null)
          ]);
          row = mergeRows(bb, bn);
        } else if (sym.exchange === 'bybit') {
          row = await fetchBybitSymbol(sym.symbol).catch(()=>null);
          if (row) row.exchanges = ['bybit'];
        } else {
          row = await fetchBinanceSymbol(sym.symbol).catch(()=>null);
          if (row) row.exchanges = ['binance'];
        }
        if (row) { row.vol = sym.vol; results.push(row); }
      } catch {}
      done++;
      setProgress(Math.round(done / total * 100));
    }
  }

  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  setProgress(100);
  return results;
}

// ═══════════════════════════════════════════════
// MAIN CYCLE
// ═══════════════════════════════════════════════
async function refresh() {
  setStatus('loading', 'Fetching…');
  hideError();

  try {
    const topSymbols = await fetchTopSymbols(topN);
    rows = await batchFetch(topSymbols);
    renderTable();
    document.getElementById('last-updated').textContent =
      `Updated ${new Date().toLocaleTimeString()}`;
    setStatus('ok', `✓ ${rows.length} symbols`);
  } catch(e) {
    showError(e.message);
    setStatus('err', '✗ Error');
  }

  scheduleRefresh();
}

function scheduleRefresh() {
  clearInterval(countdownTimer);
  countdownVal = refreshSec;
  updateCountdown();
  countdownTimer = setInterval(() => {
    countdownVal--;
    updateCountdown();
    if (countdownVal <= 0) { clearInterval(countdownTimer); refresh(); }
  }, 1000);
}

function updateCountdown() {
  document.getElementById('next-refresh').textContent = `${countdownVal}s`;
}

// ═══════════════════════════════════════════════
// SPARKLINE
// ═══════════════════════════════════════════════
function drawSparkline(canvas, data, color) {
  if (!data || data.length < 2) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;

  const pts = data.map((v,i) => ({
    x: (i / (data.length-1)) * W,
    y: H - ((v - min) / range) * (H - 4) - 2
  }));

  // Gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, color + '55');
  grad.addColorStop(1, color + '00');

  ctx.beginPath();
  ctx.moveTo(pts[0].x, H);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  pts.forEach((p,i) => i === 0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Last dot
  const last = pts[pts.length-1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 2.5, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
}

// ═══════════════════════════════════════════════
// TABLE
// ═══════════════════════════════════════════════
function buildHeader() {
  const thead = document.getElementById('thead');
  thead.innerHTML = '';

  const gr = document.createElement('tr');
  gr.innerHTML = `
    <th rowspan="2" style="width:100px;text-align:left">Symbol</th>
    <th colspan="${TIMEFRAMES.length}" class="group-th" style="border-left:1px solid var(--border)">PRICE %</th>
    <th colspan="${TIMEFRAMES.length}" class="group-th" style="border-left:1px solid var(--border)">OPEN INTEREST %</th>
    <th rowspan="2" class="group-th" style="border-left:1px solid var(--border);width:80px">OI SPARK<br><span style="font-size:8px;color:var(--muted)">15m · 6h</span></th>
    <th colspan="2" class="group-th" style="border-left:1px solid var(--border)">FUNDING</th>
  `;
  thead.appendChild(gr);

  const sr = document.createElement('tr');
  TIMEFRAMES.forEach((tf,i) => {
    const th = document.createElement('th');
    th.dataset.col = `price_${tf}`;
    th.style.width = '66px';
    if (i===0) th.style.borderLeft = '1px solid var(--border)';
    th.textContent = tf;
    sr.appendChild(th);
  });
  TIMEFRAMES.forEach((tf,i) => {
    const th = document.createElement('th');
    th.dataset.col = `oi_${tf}`;
    th.style.width = '66px';
    if (i===0) th.style.borderLeft = '1px solid var(--border)';
    th.textContent = tf;
    sr.appendChild(th);
  });
  ['fr_last','fr_delta'].forEach((col,i) => {
    const th = document.createElement('th');
    th.dataset.col = col;
    th.style.width = i===0 ? '72px' : '66px';
    if (i===0) th.style.borderLeft = '1px solid var(--border)';
    th.textContent = i===0 ? 'Last' : 'Δ';
    sr.appendChild(th);
  });
  thead.appendChild(sr);

  highlightSortCol();
  thead.querySelectorAll('[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir = sortDir==='desc'?'asc':'desc';
      else { sortCol = col; sortDir = 'desc'; }
      document.getElementById('sortSel').value = sortCol;
      document.getElementById('sortDir').value = sortDir;
      renderTable();
    });
  });
}

function highlightSortCol() {
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.col === sortCol)
      th.classList.add(sortDir==='asc'?'sort-asc':'sort-desc');
  });
}

function fmtPct(v) {
  if (v===null||v===undefined||!isFinite(v)) return null;
  return (v>=0?'+':'')+v.toFixed(2)+'%';
}

function pctCell(v, extraStyle='') {
  const txt = fmtPct(v);
  if (txt===null) return `<td class="na" style="${extraStyle}">—</td>`;
  const cls = v>2?'pos hi3':v>0?'pos hi2':v<-2?'neg lo3':v<0?'neg lo2':'zero';
  return `<td class="${cls}" style="${extraStyle}">${txt}</td>`;
}

function frCell(v, extraStyle='') {
  const txt = fmtPct(v);
  if (txt===null) return `<td class="na" style="${extraStyle}">—</td>`;
  const cls = v>0.01?'pos':v<-0.01?'neg':'zero';
  return `<td class="${cls}" style="${extraStyle}">${txt}</td>`;
}

function fmtVol(v) {
  if (!v || !isFinite(v)) return '—';
  if (v >= 1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if (v >= 1e6) return '$'+(v/1e6).toFixed(0)+'M';
  return '$'+v.toFixed(0);
}

function renderTable() {
  const q = searchQ.toLowerCase();
  let data = rows.filter(r => r.symbol.toLowerCase().includes(q));

  data.sort((a,b) => {
    let av = a[sortCol], bv = b[sortCol];
    av = (av===null||av===undefined) ? (sortDir==='desc'?-Infinity:Infinity) : av;
    bv = (bv===null||bv===undefined) ? (sortDir==='desc'?-Infinity:Infinity) : bv;
    return sortDir==='desc' ? bv-av : av-bv;
  });

  const tbody = document.getElementById('tbody');
  if (data.length===0) {
    tbody.innerHTML = `<tr><td colspan="14" style="text-align:center;padding:40px;color:var(--muted)">No symbols found</td></tr>`;
    return;
  }

  const borderL = 'border-left:1px solid var(--border)';

  tbody.innerHTML = data.map((r,idx) => {
    const base = r.symbol.replace(/USDT$/,'');
    const exch = r.exchanges||[];
    const dots = exch.map(e=>`<span class="src-dot ${e}" title="${e}"></span>`).join('');
    const sym = `<div class="sym-wrap">
      <span class="sym-base">${base}</span>
      <div class="sym-src">${dots}</div>
    </div>`;

    const priceCells = TIMEFRAMES.map((tf,i) => pctCell(r[`price_${tf}`], i===0?borderL:'')).join('');
    const oiCells    = TIMEFRAMES.map((tf,i) => pctCell(r[`oi_${tf}`], i===0?borderL:'')).join('');

    return `<tr data-idx="${idx}">
      <td>${sym}</td>
      ${priceCells}
      ${oiCells}
      <td class="spark-cell" style="${borderL}"><canvas width="80" height="28" data-idx="${idx}"></canvas></td>
      ${frCell(r.fr_last, borderL)}
      ${frCell(r.fr_delta)}
    </tr>`;
  }).join('');

  // Draw sparklines
  data.forEach((r, idx) => {
    const canvas = tbody.querySelector(`canvas[data-idx="${idx}"]`);
    if (!canvas || !r.oiHistory || r.oiHistory.length < 2) return;
    const last = r.oiHistory[r.oiHistory.length-1];
    const first = r.oiHistory[0];
    const color = last >= first ? '#00e5a0' : '#ff3d5e';
    drawSparkline(canvas, r.oiHistory, color);

    // Tooltip on hover
    canvas.addEventListener('mouseenter', e => showTooltip(e, r));
    canvas.addEventListener('mousemove', e => moveTooltip(e));
    canvas.addEventListener('mouseleave', hideTooltip);
  });

  highlightSortCol();
}

// ═══════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

function showTooltip(e, r) {
  const base = r.symbol.replace(/USDT$/,'');
  const exch = (r.exchanges||[]).join(' + ');
  const oiDir = r.oiHistory && r.oiHistory.length >= 2
    ? pct(r.oiHistory[r.oiHistory.length-1], r.oiHistory[0])
    : null;

  tooltip.innerHTML = `
    <div class="tt-sym">${base}<span style="color:var(--muted);font-size:10px;font-family:var(--mono)"> USDT</span></div>
    <div class="tt-row"><span class="tt-label">Exchange</span><span class="tt-val" style="color:var(--accent)">${exch}</span></div>
    <div class="tt-row"><span class="tt-label">24h Volume</span><span class="tt-val">${fmtVol(r.vol)}</span></div>
    <div class="tt-row"><span class="tt-label">FR Last</span><span class="tt-val ${r.fr_last>0?'pos':'neg'}">${fmtPct(r.fr_last)||'—'}</span></div>
    <div class="tt-row"><span class="tt-label">OI (6h)</span><span class="tt-val ${oiDir>0?'pos':'neg'}">${fmtPct(oiDir)||'—'}</span></div>
    <div class="tt-chart-label">OI history (15m × ${(r.oiHistory||[]).length} bars)</div>
  `;

  // Mini chart in tooltip
  const cvs = document.createElement('canvas');
  cvs.width = 172; cvs.height = 40;
  tooltip.appendChild(cvs);
  if (r.oiHistory && r.oiHistory.length >= 2) {
    const last = r.oiHistory[r.oiHistory.length-1];
    const first = r.oiHistory[0];
    drawSparkline(cvs, r.oiHistory, last>=first?'#00e5a0':'#ff3d5e');
  }

  tooltip.style.display = 'block';
  moveTooltip(e);
}

function moveTooltip(e) {
  const pad = 12;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + 220 > window.innerWidth)  x = e.clientX - 220 - pad;
  if (y + 200 > window.innerHeight) y = e.clientY - 200 - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() { tooltip.style.display = 'none'; }

// ═══════════════════════════════════════════════
// SKELETON
// ═══════════════════════════════════════════════
function showSkeleton(n=20) {
  const cols = 1 + TIMEFRAMES.length*2 + 1 + 2; // sym + price + oi + spark + fr
  document.getElementById('tbody').innerHTML =
    Array.from({length:n}, () =>
      `<tr class="skel">${Array.from({length:cols}, () => '<td><span></span></td>').join('')}</tr>`
    ).join('');
}

// ═══════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════
function setStatus(type, msg) {
  const el = document.getElementById('status-pill');
  el.className = type; el.textContent = msg;
}
function setProgress(p) { document.getElementById('progress-bar').style.width = p + '%'; }
function showError(msg) { const el=document.getElementById('error-banner'); el.style.display='block'; el.textContent='⚠ '+msg; }
function hideError()    { document.getElementById('error-banner').style.display='none'; }

// ═══════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════
document.getElementById('topN').addEventListener('change', e => {
  topN = Math.max(5, Math.min(200, parseInt(e.target.value)||50));
  clearInterval(countdownTimer); refresh();
});
document.getElementById('refreshSel').addEventListener('change', e => {
  refreshSec = parseInt(e.target.value); scheduleRefresh();
});
document.getElementById('sortSel').addEventListener('change', e => { sortCol = e.target.value; renderTable(); });
document.getElementById('sortDir').addEventListener('change', e => { sortDir = e.target.value; renderTable(); });
document.getElementById('search').addEventListener('input', e => { searchQ = e.target.value; renderTable(); });

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
buildHeader();
showSkeleton(25);
refresh();
</script>
</body>
</html>
