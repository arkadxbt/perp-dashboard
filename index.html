<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PerpDash Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e13;--panel:#0f1219;--row:#111620;--row-alt:#0d1017;--border:#1c2333;--border2:#242e42;--muted:#3d5070;--dim:#5a7090;--text:#9ab0c8;--bright:#d8e8f8;--white:#eef4fc;--green:#00d68f;--green2:#00ff9f;--red:#ff3355;--red2:#ff6680;--yellow:#f5c020;--blue:#2d7aff;--blue2:#5598ff;--cyan:#00c8e0;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--hh:36px;--rh:32px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;height:100vh;overflow:hidden;}
#titlebar{height:var(--hh);background:var(--panel);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 12px;gap:0;flex-shrink:0;}
.tb-logo{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--white);letter-spacing:.2px;margin-right:16px;display:flex;align-items:center;gap:6px;}
.tb-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
.tb-sep{width:1px;height:20px;background:var(--border2);margin:0 10px;}
.tb-time{font-size:11px;color:var(--dim);font-family:var(--mono);margin-right:6px;}
#tb-clock{color:var(--text);}
.tb-badges{display:flex;gap:4px;align-items:center;}
.tb-badge{font-size:9px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:2px;border:1px solid;text-transform:uppercase;}
.tb-badge.bybit{border-color:#f7a600;color:#f7a600;background:rgba(247,166,0,.08);}
.tb-badge.binance{border-color:#f5c020;color:#f5c020;background:rgba(245,192,32,.06);}
.tb-controls{display:flex;align-items:center;gap:8px;margin-left:auto;}
.tb-ctrl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
.tb-ctrl label{white-space:nowrap;}
select,input[type=number],input[type=text]{background:#080c12;border:1px solid var(--border2);color:var(--bright);font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:2px;outline:none;height:20px;}
select:focus,input:focus{border-color:var(--blue);}
#topN{width:50px;}#srch{width:110px;background:#080c12;border-color:var(--border);}
#status{font-size:9px;padding:2px 8px;border-radius:2px;border:1px solid;white-space:nowrap;border-color:var(--muted);color:var(--muted);}
#status.ok{border-color:var(--green);color:var(--green);}
#status.err{border-color:var(--red);color:var(--red);}
#status.loading{border-color:var(--yellow);color:var(--yellow);animation:blink .8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#prog{height:2px;background:var(--border);}
#prog-bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s;}
#layout{display:flex;height:calc(100vh - var(--hh) - 2px - 20px);overflow:hidden;}
#table-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#tbl-scroll{flex:1;overflow-y:auto;overflow-x:hidden;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
thead{position:sticky;top:0;z-index:10;background:var(--panel);}
th{height:24px;padding:0 6px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:right;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
th:first-child{text-align:left;}
th:hover{color:var(--bright);background:rgba(45,122,255,.05);}
th.sort-asc::after{content:'↑';color:var(--blue);margin-left:3px;}
th.sort-desc::after{content:'↓';color:var(--blue);margin-left:3px;}
.th-grp{text-align:center !important;font-size:8px !important;color:var(--blue2) !important;letter-spacing:1.2px;background:rgba(45,122,255,.04);border-left:1px solid var(--border2);border-bottom:1px solid var(--border2) !important;cursor:default !important;padding:0 !important;vertical-align:middle;}
.th-grp:hover{background:rgba(45,122,255,.04) !important;color:var(--blue2) !important;}
td{height:var(--rh);padding:0 6px;text-align:right;font-size:13px;font-family:var(--mono);border-bottom:1px solid #0c0f16;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle;}
td:first-child{text-align:left;}
tr.dr{cursor:pointer;}
tr.dr:nth-child(odd) td{background:var(--row);}
tr.dr:nth-child(even) td{background:var(--row-alt);}
tr.dr:hover td{background:#141c2a !important;}
tr.dr.sel td{background:#0d1a30 !important;border-bottom-color:#1a3060;}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--muted)}.na{color:#1e2535;}
.hi3{color:var(--green2) !important;font-weight:600}.hi2{color:var(--green)}.lo3{color:var(--red2) !important;font-weight:600}.lo2{color:var(--red)}
.gl{border-left:1px solid var(--border2) !important;}
.sn{font-family:var(--sans);font-weight:800;font-size:16px;color:var(--white);letter-spacing:-.3px;}
.sq{font-size:10px;color:var(--muted);font-weight:400;font-family:var(--mono);}
.se{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px;}
.edot{width:5px;height:5px;border-radius:50%;display:inline-block;}
.edot.bybit{background:#f7a600;}.edot.binance{background:#f5c020;}
.spk{padding:2px 6px !important;vertical-align:middle;}
.spk canvas{display:block;margin:0 auto;}
#detail-pane{width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--border2);display:flex;flex-direction:column;transition:width .2s ease;flex-shrink:0;}
#detail-pane.open{width:460px;}
#d-top{padding:10px 12px 8px;border-bottom:1px solid var(--border);flex-shrink:0;}
#d-sym{font-family:var(--sans);font-size:30px;font-weight:800;color:var(--white);letter-spacing:-.8px;display:flex;align-items:baseline;gap:5px;}
#d-sym .q{font-size:11px;color:var(--muted);font-family:var(--mono);}
#d-close{float:right;background:none;border:1px solid var(--border2);color:var(--muted);font-size:12px;width:20px;height:20px;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;margin-top:2px;}
#d-close:hover{border-color:var(--red);color:var(--red);}
#d-meta{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.dpill{font-size:9px;font-weight:600;letter-spacing:.4px;padding:1px 6px;border-radius:2px;border:1px solid var(--border2);color:var(--dim);}
#d-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border2);flex-shrink:0;}
.dst{background:var(--panel);padding:12px 14px;}
.dsl{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.dsv{font-size:22px;font-weight:700;font-family:var(--sans);color:var(--bright);}
.dsv.pos{color:var(--green);}.dsv.neg{color:var(--red);}
#d-cw{flex-shrink:0;padding:12px 14px;border-bottom:1px solid var(--border);}
.dsl2{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.dsl2::after{content:'';flex:1;height:1px;background:var(--border);}
#d-canvas{width:100%;display:block;}
#d-tf{flex:1;overflow-y:auto;padding:8px 10px;}
.dtft{width:100%;border-collapse:collapse;}
.dtft th{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:4px 6px;text-align:right;border-bottom:1px solid var(--border);cursor:default;height:auto;}
.dtft th:first-child{text-align:left;color:var(--dim);}
.dtft th:hover{color:var(--muted);background:none;}
.dtft td{font-size:13px;padding:7px 8px;text-align:right;border-bottom:1px solid #0c0f16;height:auto;}
.dtft td:first-child{text-align:left;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
#statusbar{height:20px;background:var(--panel);border-top:1px solid var(--border2);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:9px;color:var(--muted);}
#sb-next span{color:var(--text);font-weight:600;}
#sb-up{margin-left:auto;}
#err-box{display:none;background:rgba(255,51,85,.07);border:1px solid var(--red);border-radius:3px;padding:6px 12px;color:var(--red);font-size:11px;margin:4px 6px;}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── MOBILE ── */
@media (max-width: 768px) {
  html,body { font-size:13px; overflow:auto; height:auto; }

  #titlebar {
    height:auto;
    flex-wrap:wrap;
    padding:8px 10px;
    gap:8px;
  }
  .tb-logo { font-size:15px; }
  .tb-sep  { display:none; }
  .tb-time { font-size:10px; }
  .tb-controls {
    width:100%;
    flex-wrap:wrap;
    gap:6px;
    margin-left:0;
  }
  .tb-ctrl { flex:1; min-width:80px; }
  #srch { width:100%; }
  #status { margin-left:auto; }

  #layout {
    flex-direction:column;
    height:auto;
    overflow:visible;
  }

  #table-pane { overflow:visible; }
  #tbl-scroll { overflow-x:auto; overflow-y:visible; }

  table { table-layout:auto; min-width:700px; }
  th { font-size:9px; padding:0 4px; }
  td { font-size:11px; padding:0 4px; height:28px; }
  .sn { font-size:13px; }

  /* Detail pane: full screen overlay on mobile */
  #detail-pane {
    position:fixed !important;
    inset:0 !important;
    width:100% !important;
    max-width:100% !important;
    z-index:300;
    overflow-y:auto;
    transition:transform .25s ease;
    transform:translateX(100%);
    border-left:none !important;
  }
  #detail-pane.open {
    width:100% !important;
    transform:translateX(0);
  }
  #d-top { padding:14px 14px 10px; }
  #d-sym { font-size:26px !important; }
  #d-stats { grid-template-columns:1fr 1fr; }
  .dsv { font-size:20px !important; }
  #d-canvas { height:200px !important; }
  #d-close { width:28px; height:28px; font-size:14px; }

  #statusbar {
    position:static;
    flex-wrap:wrap;
    height:auto;
    padding:6px 10px;
    gap:4px;
    font-size:9px;
  }
  #sb-up { margin-left:0; width:100%; }
}

@media (max-width: 480px) {
  .tb-badge { font-size:8px; padding:1px 5px; }
  #d-sym { font-size:22px !important; }
  .dsv { font-size:18px !important; }
  .dsl { font-size:10px !important; }
  .dtft td { font-size:12px !important; }
}
</style>
</head>
<body>
<div id="titlebar">
  <div class="tb-logo"><span class="dot"></span>PerpDash</div>
  <div class="tb-badges"><span class="tb-badge bybit">Bybit</span><span class="tb-badge binance">Binance</span></div>
  <div class="tb-sep"></div>
  <div class="tb-time">UTC <span id="tb-clock">--:--:--</span></div>
  <div class="tb-sep"></div>
  <div class="tb-controls">
    <div class="tb-ctrl"><label>Top</label><input type="number" id="topN" value="100" min="5" max="200" step="5"/></div>
    <div class="tb-ctrl"><label>Refresh</label><select id="refSel"><option value="10">10s</option><option value="20" selected>20s</option><option value="30">30s</option><option value="60">60s</option><option value="120">120s</option></select></div>
    <div class="tb-ctrl"><label>Sort</label>
      <select id="sortSel"><option value="vol">Volume</option><option value="price_5m">Price 5m</option><option value="price_15m">Price 15m</option><option value="price_1h">Price 1h</option><option value="price_4h">Price 4h</option><option value="price_1d">Price 1d</option><option value="oi_5m">OI 5m</option><option value="oi_15m">OI 15m</option><option value="oi_1h">OI 1h</option><option value="oi_4h">OI 4h</option><option value="oi_1d">OI 1d</option><option value="fr_last">Funding</option></select>
      <select id="dirSel"><option value="desc">↓</option><option value="asc">↑</option></select>
    </div>
    <div class="tb-ctrl"><input type="text" id="srch" placeholder="Search…"/></div>
    <div id="status" class="loading">Connecting</div>
  </div>
</div>
<div id="prog"><div id="prog-bar"></div></div>
<div id="layout">
  <div id="table-pane">
    <div id="err-box"></div>
    <div id="tbl-scroll">
      <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    </div>
  </div>
  <div id="detail-pane">
    <div id="d-top">
      <button id="d-close" onclick="closeD()">✕</button>
      <div id="d-sym"><span id="d-sn">—</span><span class="q">USDT PERP</span></div>
      <div id="d-meta"></div>
    </div>
    <div id="d-stats"></div>
    <div id="d-cw">
      <div class="dsl2">OI History · 15m bars · TSİ</div>
      <canvas id="d-canvas" height="240"></canvas>
    </div>
    <div id="d-tf">
      <div class="dsl2" style="margin-bottom:8px">Timeframe Breakdown</div>
      <table class="dtft">
        <thead><tr><th></th><th>5m</th><th>15m</th><th>1h</th><th>4h</th><th>1d</th></tr></thead>
        <tbody id="d-tf-body"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="statusbar">
  <span>Bybit V5 + Binance Futures · USDT Perpetuals · Browser-side API</span>
  <span id="sb-next">Next: <span id="next-ref">—</span></span>
  <span id="sb-up">—</span>
</div>
<script>
const BB='https://api.bybit.com',BN='https://fapi.binance.com';
const TFS=['5m','15m','1h','4h','1d'];
const BBK={'5m':'5','15m':'15','1h':'60','4h':'240','1d':'D'};
const BBO={'5m':'5min','15m':'15min','1h':'1h','4h':'4h','1d':'1d'};
const BNK={'5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d'};
const BNO={'5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d'};
let rows=[],sortCol='vol',sortDir='desc',searchQ='',refreshSec=20,topN=50,cdTimer,cdVal,selSym=null;

function tickClock(){const n=new Date();const p=x=>String(x).padStart(2,'0');document.getElementById('tb-clock').textContent=p(n.getUTCHours())+':'+p(n.getUTCMinutes())+':'+p(n.getUTCSeconds());}
setInterval(tickClock,1000);tickClock();

const sig=()=>AbortSignal.timeout(10000);
async function bbG(path,p={}){const u=new URL(BB+path);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{signal:sig()});const j=await r.json();if(j.retCode!==0)throw new Error(j.retMsg);return j.result;}
async function bnG(path,p={}){const u=new URL(BN+path);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{signal:sig()});if(!r.ok)throw new Error(r.status);return r.json();}
const pct=(n,o)=>{n=parseFloat(n);o=parseFloat(o);return(!isFinite(n)||!isFinite(o)||o===0)?null:(n-o)/Math.abs(o)*100;};

async function getTop(n){
  const[bb,bn]=await Promise.all([bbG('/v5/market/tickers',{category:'linear'}).catch(()=>({list:[]})),bnG('/fapi/v1/ticker/24hr').catch(()=>[])]);
  const bbL=(bb.list||[]).filter(t=>t.symbol.endsWith('USDT')&&!t.symbol.includes('-')).sort((a,b)=>parseFloat(b.turnover24h)-parseFloat(a.turnover24h)).slice(0,n).map(t=>({symbol:t.symbol,vol:parseFloat(t.turnover24h||0),hasBybit:true}));
  const bnM={};(Array.isArray(bn)?bn:[]).filter(t=>t.symbol.endsWith('USDT')).forEach(t=>{bnM[t.symbol]=parseFloat(t.quoteVolume||0);});
  const bbS=new Set(bbL.map(x=>x.symbol));
  for(const s of bbL)if(bnM[s.symbol])s.hasBinance=true;
  const bnO=Object.entries(bnM).filter(([s])=>!bbS.has(s)).sort((a,b)=>b[1]-a[1]).slice(0,Math.floor(n/4)).map(([s,v])=>({symbol:s,vol:v,hasBinance:true}));
  return[...bbL,...bnO].sort((a,b)=>b.vol-a.vol).slice(0,n);
}

async function fBB(sym){
  const kP=TFS.map(tf=>bbG('/v5/market/kline',{category:'linear',symbol:sym,interval:BBK[tf],limit:3}).catch(()=>null));
  const oP=TFS.map(tf=>bbG('/v5/market/open-interest',{category:'linear',symbol:sym,intervalTime:BBO[tf],limit:3}).catch(()=>null));
  const hP=bbG('/v5/market/open-interest',{category:'linear',symbol:sym,intervalTime:'15min',limit:48}).catch(()=>null);
  const fP=bbG('/v5/market/funding/history',{category:'linear',symbol:sym,limit:2}).catch(()=>null);
  const[kR,oR,hR,fR]=await Promise.all([Promise.all(kP),Promise.all(oP),hP,fP]);
  const row={symbol:sym};
  TFS.forEach((tf,i)=>{try{const l=kR[i]?.list;row['p_'+tf]=(l&&l.length>=2)?pct(l[0][4],l[1][4]):null;}catch{row['p_'+tf]=null;}});
  TFS.forEach((tf,i)=>{try{const l=oR[i]?.list;row['o_'+tf]=(l&&l.length>=2)?pct(l[0].openInterest,l[1].openInterest):null;}catch{row['o_'+tf]=null;}});
  try{const l=hR?.list||[];row.oiH=l.map(x=>parseFloat(x.openInterest)).reverse();row.oiT=l.map(x=>parseInt(x.timestamp)).reverse();}catch{row.oiH=[];row.oiT=[];}
  try{const l=fR?.list;if(l&&l.length){row.fr=parseFloat(l[0].fundingRate)*100;row.frd=l.length>=2?row.fr-parseFloat(l[1].fundingRate)*100:null;}else{row.fr=row.frd=null;}}catch{row.fr=row.frd=null;}
  return row;
}
async function fBN(sym){
  const kP=TFS.map(tf=>bnG('/fapi/v1/klines',{symbol:sym,interval:BNK[tf],limit:3}).catch(()=>null));
  const oP=TFS.map(tf=>bnG('/futures/data/openInterestHist',{symbol:sym,period:BNO[tf],limit:3}).catch(()=>null));
  const hP=bnG('/futures/data/openInterestHist',{symbol:sym,period:'15m',limit:48}).catch(()=>null);
  const fP=bnG('/fapi/v1/fundingRate',{symbol:sym,limit:2}).catch(()=>null);
  const[kR,oR,hR,fR]=await Promise.all([Promise.all(kP),Promise.all(oP),hP,fP]);
  const row={symbol:sym};
  TFS.forEach((tf,i)=>{try{const l=kR[i];row['p_'+tf]=(l&&l.length>=2)?pct(l[l.length-1][4],l[l.length-2][4]):null;}catch{row['p_'+tf]=null;}});
  TFS.forEach((tf,i)=>{try{const l=oR[i];row['o_'+tf]=(l&&l.length>=2)?pct(l[l.length-1].sumOpenInterest,l[l.length-2].sumOpenInterest):null;}catch{row['o_'+tf]=null;}});
  try{const l=hR||[];row.oiH=l.map(x=>parseFloat(x.sumOpenInterest));row.oiT=l.map(x=>parseInt(x.timestamp));}catch{row.oiH=[];row.oiT=[];}
  try{if(fR&&fR.length){row.fr=parseFloat(fR[fR.length-1].fundingRate)*100;row.frd=fR.length>=2?row.fr-parseFloat(fR[fR.length-2].fundingRate)*100:null;}else{row.fr=row.frd=null;}}catch{row.fr=row.frd=null;}
  return row;
}
function mrg(bb,bn){
  if(!bb&&!bn)return null;if(!bb)return{...bn,ex:['binance']};if(!bn)return{...bb,ex:['bybit']};
  const m={...bb,ex:['bybit','binance']};
  TFS.forEach(tf=>{const[a,b]=[bb['o_'+tf],bn['o_'+tf]];if(a!=null&&b!=null&&isFinite(a)&&isFinite(b))m['o_'+tf]=(a+b)/2;const[c,d]=[bb['p_'+tf],bn['p_'+tf]];if(c!=null&&d!=null&&isFinite(c)&&isFinite(d))m['p_'+tf]=(c+d)/2;});
  if(bb.fr!=null&&bn.fr!=null)m.fr=(bb.fr+bn.fr)/2;return m;
}

async function batchFetch(syms){
  const res=[];let idx=0,done=0;setProg(0);
  async function w(){while(true){const i=idx++;if(i>=syms.length)break;const s=syms[i];try{let row;if(s.hasBybit&&s.hasBinance){const[bb,bn]=await Promise.all([fBB(s.symbol).catch(()=>null),fBN(s.symbol).catch(()=>null)]);row=mrg(bb,bn);}else if(s.hasBybit){row=await fBB(s.symbol).catch(()=>null);if(row)row.ex=['bybit'];}else{row=await fBN(s.symbol).catch(()=>null);if(row)row.ex=['binance'];}if(row){row.vol=s.vol;res.push(row);}}catch{}done++;setProg(Math.round(done/syms.length*100));}}
  await Promise.all(Array.from({length:6},w));setProg(100);return res;
}

async function refresh(){
  setSt('loading','Loading…');hideErr();
  try{
    const top=await getTop(topN);rows=await batchFetch(top);renderTable();
    document.getElementById('sb-up').textContent='Updated '+new Date().toLocaleTimeString();
    setSt('ok','✓ '+rows.length+' symbols');
    if(selSym){const r=rows.find(x=>x.symbol===selSym);if(r)renderDetail(r);}
  }catch(e){showErr(e.message);setSt('err','✗ Error');}
  schedRef();
}
function schedRef(){clearInterval(cdTimer);cdVal=refreshSec;updCd();cdTimer=setInterval(()=>{cdVal--;updCd();if(cdVal<=0){clearInterval(cdTimer);refresh();}},1000);}
function updCd(){document.getElementById('next-ref').textContent=cdVal+'s';}

function spark(cv,data,color){
  if(!data||data.length<2)return;
  const W=cv.width,H=cv.height,ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const pts=data.map((v,i)=>({x:(i/(data.length-1))*W,y:H-((v-mn)/rng)*(H-4)-2}));
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,color+'40');g.addColorStop(1,color+'00');
  ctx.beginPath();ctx.moveTo(0,H);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(W,H);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke();
  const lp=pts[pts.length-1];ctx.beginPath();ctx.arc(lp.x,lp.y,2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
}
function drawOI(cv,data,ts){
  if(!data||data.length<2)return;
  const dpr=window.devicePixelRatio||1,W=cv.offsetWidth||320,H=cv.height;
  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const pad={t:8,r:8,b:22,l:60},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const mn=Math.min(...data)*.999,mx=Math.max(...data)*1.001,rng=mx-mn||1;
  const color=data[data.length-1]>=data[0]?'#00d68f':'#ff3355';
  ctx.fillStyle='#0b0e13';ctx.fillRect(0,0,W,H);
  for(let i=0;i<=4;i++){const y=pad.t+ch*(1-i/4);ctx.strokeStyle='#1c2333';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();const val=mn+rng*i/4;ctx.fillStyle='#3d5070';ctx.font='9px "IBM Plex Mono"';ctx.textAlign='right';ctx.fillText(fmtOI(val),pad.l-4,y+3);}
  const step=Math.ceil(data.length/5);ctx.fillStyle='#3d5070';ctx.font='8px "IBM Plex Mono"';ctx.textAlign='center';
  for(let i=0;i<data.length;i+=step){const x=pad.l+(i/(data.length-1))*cw;const t=ts&&ts[i];if(t){const d=new Date(t);const tsi=new Date(d.getTime()+3*3600000);ctx.fillText(String(tsi.getUTCHours()).padStart(2,'0')+':'+String(tsi.getUTCMinutes()).padStart(2,'0'),x,H-pad.b+13);}}
  const pts=data.map((v,i)=>({x:pad.l+(i/(data.length-1))*cw,y:pad.t+ch*(1-(v-mn)/rng)}));
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);g.addColorStop(0,color+'35');g.addColorStop(1,color+'00');
  ctx.beginPath();ctx.moveTo(pts[0].x,pad.t+ch);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,pad.t+ch);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke();
  const lp=pts[pts.length-1];ctx.beginPath();ctx.arc(lp.x,lp.y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
}

function buildHeader(){
  const thead=document.getElementById('thead');thead.innerHTML='';const tfn=TFS.length;
  const gr=document.createElement('tr');
  gr.innerHTML=`<th rowspan="2" style="width:130px;text-align:left">Symbol</th><th colspan="${tfn}" class="th-grp gl">PRICE %</th><th colspan="${tfn}" class="th-grp gl">OPEN INTEREST %</th><th rowspan="2" class="th-grp gl" style="width:80px;font-size:8px;vertical-align:middle">OI TREND</th><th colspan="2" class="th-grp gl">FUNDING</th>`;
  thead.appendChild(gr);
  const sr=document.createElement('tr');
  TFS.forEach((tf,i)=>{const th=document.createElement('th');th.dataset.col='p_'+tf;th.style.width='62px';if(i===0)th.classList.add('gl');th.textContent=tf;sr.appendChild(th);});
  TFS.forEach((tf,i)=>{const th=document.createElement('th');th.dataset.col='o_'+tf;th.style.width='62px';if(i===0)th.classList.add('gl');th.textContent=tf;sr.appendChild(th);});
  ['fr','frd'].forEach((col,i)=>{const th=document.createElement('th');th.dataset.col=col;th.style.width=i===0?'70px':'60px';if(i===0)th.classList.add('gl');th.textContent=i===0?'Last':'Δ';sr.appendChild(th);});
  thead.appendChild(sr);updSortUI();
  thead.querySelectorAll('[data-col]').forEach(th=>{th.addEventListener('click',()=>{const c=th.dataset.col;if(sortCol===c)sortDir=sortDir==='desc'?'asc':'desc';else{sortCol=c;sortDir='desc';}document.getElementById('sortSel').value=sortCol;document.getElementById('dirSel').value=sortDir;renderTable();});});
}
function updSortUI(){document.querySelectorAll('th[data-col]').forEach(th=>{th.classList.remove('sort-asc','sort-desc');if(th.dataset.col===sortCol)th.classList.add(sortDir==='asc'?'sort-asc':'sort-desc');});}

const fmtP=v=>{if(v==null||!isFinite(v))return null;return(v>=0?'+':'')+v.toFixed(2)+'%';};
const fmtOI=v=>{if(!isFinite(v))return'—';if(v>=1e9)return(v/1e9).toFixed(2)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return v.toFixed(0);};
const fmtVol=v=>{if(!v||!isFinite(v))return'—';if(v>=1e9)return'$'+(v/1e9).toFixed(1)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(0)+'M';return'$'+v.toFixed(0);};
function pCell(v,gl=false){const t=fmtP(v);if(t===null)return`<td class="na${gl?' gl':''}">—</td>`;const c=v>2?'hi3':v>0?'hi2':v<-2?'lo3':v<0?'lo2':'zero';return`<td class="${c}${gl?' gl':''}">${t}</td>`;}
function frCell(v,gl=false){const t=fmtP(v);if(t===null)return`<td class="na${gl?' gl':''}">—</td>`;const c=v>0.01?'pos':v<-0.01?'neg':'zero';return`<td class="${c}${gl?' gl':''}">${t}</td>`;}

function renderTable(){
  const q=searchQ.toLowerCase();
  let data=rows.filter(r=>r.symbol.toLowerCase().includes(q));
  data.sort((a,b)=>{let av=a[sortCol],bv=b[sortCol];av=(av==null)?(sortDir==='desc'?-Infinity:Infinity):av;bv=(bv==null)?(sortDir==='desc'?-Infinity:Infinity):bv;return sortDir==='desc'?bv-av:av-bv;});
  const tbody=document.getElementById('tbody');
  if(!data.length){tbody.innerHTML=`<tr><td colspan="14" style="text-align:center;padding:40px;color:var(--muted)">No results</td></tr>`;return;}
  tbody.innerHTML=data.map((r,i)=>{
    const base=r.symbol.replace(/USDT$/,'');
    const dots=(r.ex||[]).map(e=>`<span class="edot ${e}"></span>`).join('');
    const isSel=selSym===r.symbol;
    return`<tr class="dr${isSel?' sel':''}" data-idx="${i}"><td><span class="sn">${base}<span class="sq">USDT</span></span><span class="se">${dots}</span></td>${TFS.map((tf,j)=>pCell(r['p_'+tf],j===0)).join('')}${TFS.map((tf,j)=>pCell(r['o_'+tf],j===0)).join('')}<td class="spk gl"><canvas width="80" height="26" data-idx="${i}"></canvas></td>${frCell(r.fr,true)}${frCell(r.frd)}</tr>`;
  }).join('');
  data.forEach((r,i)=>{
    const c=tbody.querySelector(`canvas[data-idx="${i}"]`);
    if(c&&r.oiH&&r.oiH.length>=2)spark(c,r.oiH,r.oiH[r.oiH.length-1]>=r.oiH[0]?'#00d68f':'#ff3355');
    const tr=tbody.querySelector(`tr[data-idx="${i}"]`);
    if(tr)tr.addEventListener('click',()=>openD(r));
  });
  updSortUI();
}

function openD(r){selSym=r.symbol;renderDetail(r);document.getElementById('detail-pane').classList.add('open');}
function renderDetail(r){
  const base=r.symbol.replace(/USDT$/,'');
  document.getElementById('d-sn').textContent=base;
  document.getElementById('d-meta').innerHTML=(r.ex||[]).map(e=>`<span class="dpill">${e.toUpperCase()}</span>`).join('')+`<span class="dpill">Vol: ${fmtVol(r.vol)}</span>`;
  const sc=v=>v!=null&&isFinite(v)?(v>0?'pos':v<0?'neg':''):'';
  const sv=(v,d=2)=>v!=null&&isFinite(v)?((v>=0?'+':'')+v.toFixed(d)+'%'):'—';
  document.getElementById('d-stats').innerHTML=[
    ['Price 1h',r['p_1h']],['Price 4h',r['p_4h']],['Price 1d',r['p_1d']],
    ['OI 1h',r['o_1h']],['OI 4h',r['o_4h']],
    ['Funding',r.fr,4],['FR Delta',r.frd,4],['OI 1d',r['o_1d']]
  ].map(([l,v,d])=>`<div class="dst"><div class="dsl">${l}</div><div class="dsv ${sc(v)}">${sv(v,d||2)}</div></div>`).join('');
  document.getElementById('d-tf-body').innerHTML=[['Price %','p_'],['OI %','o_']].map(([l,k])=>`<tr><td>${l}</td>${TFS.map(tf=>{const v=r[k+tf];const t=fmtP(v);const c=v>2?'hi3':v>0?'hi2':v<-2?'lo3':v<0?'lo2':'zero';return t?`<td class="${c}">${t}</td>`:`<td class="na">—</td>`;}).join('')}</tr>`).join('');
  requestAnimationFrame(()=>{const cv=document.getElementById('d-canvas');if(r.oiH&&r.oiH.length>=2)drawOI(cv,r.oiH,r.oiT||[]);});
}
function closeD(){document.getElementById('detail-pane').classList.remove('open');selSym=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});

function showSkel(n=20){const c=1+TFS.length*2+1+2;document.getElementById('tbody').innerHTML=Array.from({length:n},(_,i)=>`<tr class="dr${i%2?' ':' '}">${Array.from({length:c},()=>'<td>&nbsp;</td>').join('')}</tr>`).join('');}
function setSt(t,m){const el=document.getElementById('status');el.className=t;el.textContent=m;}
function setProgress(p){document.getElementById('prog-bar').style.width=p+'%';}
function setProgP(p){setProgress(p);}
function setP(p){setProgress(p);}
function setP2(p){setProgress(p);}
let _setP=setProgress;
function setProg(p){document.getElementById('prog-bar').style.width=p+'%';}
function showErr(m){const el=document.getElementById('err-box');el.style.display='block';el.textContent='⚠ '+m;}
function hideErr(){document.getElementById('err-box').style.display='none';}

document.getElementById('topN').addEventListener('change',e=>{topN=Math.max(5,Math.min(200,parseInt(e.target.value)||50));clearInterval(cdTimer);refresh();});
document.getElementById('refSel').addEventListener('change',e=>{refreshSec=parseInt(e.target.value);schedRef();});
document.getElementById('sortSel').addEventListener('change',e=>{sortCol=e.target.value;renderTable();});
document.getElementById('dirSel').addEventListener('change',e=>{sortDir=e.target.value;renderTable();});
document.getElementById('srch').addEventListener('input',e=>{searchQ=e.target.value;renderTable();});

buildHeader();showSkel(25);refresh();
</script>
</body>
